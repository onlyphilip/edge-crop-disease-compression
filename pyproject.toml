[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-crop-disease-ai"
version = "0.1.0"
description = "EdgeAI scaffold for plant disease classification with TensorFlow/Keras and TFLite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tensorflow>=2.14",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "pyyaml>=6.0",
  "Pillow>=10.0",
  "streamlit>=1.35",
  "tqdm>=4.66",
  "kagglehub>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
